<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Artikelanfrage – DoProCA</title>

    <link
        rel="stylesheet"
        href="css/anfrage.css"
    >

</head>


<body>

    <main class="inquiry-page">


        <!-- FORMULAR-KARTE -->

        <section class="inquiry-card">


            <!-- SCHLIESSEN -->

            <button
                type="button"
                class="inquiry-close"
                onclick="closeInquiry()"
                aria-label="Formular schließen"
            >
                ×
            </button>



            <!-- KOPF -->

            <div class="inquiry-header">

                <div class="section-label">
                    ANFRAGE
                </div>

                <h1>
                    Artikel anfragen
                </h1>

                <p>
                    Sie interessieren sich für einen Artikel?
                    Senden Sie uns Ihre Anfrage – wir melden uns
                    anschließend bei Ihnen.
                </p>

            </div>



            <!-- FORMULAR -->

            <form
                id="inquiry-form"
                method="POST"
            >


                <!-- ARTIKEL -->

                <div class="form-field">

                    <label for="article">
                        Artikel
                    </label>

                    <select
                        id="article"
                        name="article"
                        required
                    >

                        <option value="">
                            Artikel auswählen
                        </option>

                    </select>

                </div>



                <!-- VORNAME / NACHNAME -->

                <div class="form-row">

                    <div class="form-field">

                        <label for="first-name">
                            Vorname
                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="first_name"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="last-name">
                            Nachname
                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="last_name"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>



                <!-- FIRMA -->

                <div class="form-field">

                    <label for="company">
                        Firma
                    </label>

                    <input
                        type="text"
                        id="company"
                        name="company"
                        autocomplete="organization"
                    >

                </div>



                <!-- STRASSE -->

                <div class="form-field">

                    <label for="street">
                        Straße
                    </label>

                    <input
                        type="text"
                        id="street"
                        name="street"
                        autocomplete="street-address"
                        required
                    >

                </div>



                <!-- PLZ / ORT -->

                <div class="form-row address-row">

                    <div class="form-field postal-field">

                        <label for="postal-code">
                            PLZ
                        </label>

                        <input
                            type="text"
                            id="postal-code"
                            name="postal_code"
                            autocomplete="postal-code"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="city">
                            Ort
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            autocomplete="address-level2"
                            required
                        >

                    </div>

                </div>



                <!-- LAND -->

                <div class="form-field">

                    <label for="country">
                        Land
                    </label>

                    <select
                        id="country"
                        name="country"
                        autocomplete="country-name"
                        required
                    >

                        <option value="Deutschland">
                            Deutschland
                        </option>

                        <option value="Österreich">
                            Österreich
                        </option>

                        <option value="Schweiz">
                            Schweiz
                        </option>

                        <option value="Niederlande">
                            Niederlande
                        </option>

                        <option value="Belgien">
                            Belgien
                        </option>

                        <option value="Frankreich">
                            Frankreich
                        </option>

                        <option value="Italien">
                            Italien
                        </option>

                        <option value="Spanien">
                            Spanien
                        </option>

                        <option value="Vereinigtes Königreich">
                            Vereinigtes Königreich
                        </option>

                        <option value="USA">
                            USA
                        </option>

                        <option value="other">
                            Anderes Land
                        </option>

                    </select>

                </div>



                <!-- DATENSCHUTZ -->

                <div class="form-consent">

                    <label>

                        <input
                            type="checkbox"
                            name="privacy"
                            required
                        >

                        <span>
                            Ich habe die
                            <a
                                href="datenschutz.html"
                                target="_blank"
                            >
                                Datenschutzerklärung
                            </a>
                            gelesen und stimme der Verarbeitung
                            meiner Angaben zur Bearbeitung meiner
                            Anfrage zu.
                        </span>

                    </label>

                </div>



                <!-- ABSCHICKEN -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Anfrage abschicken
                    <span>→</span>
                </button>


            </form>

        </section>

    </main>


    <script src="js/anfrage.js"></script>

</body>

</html>
